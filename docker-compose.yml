services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app:z
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_PATH: /app/data/cart-order.sqlite
      GEOCODER_USER_AGENT: cart-order-api-interview/1.0
    command: php -S 0.0.0.0:8000 -t public
